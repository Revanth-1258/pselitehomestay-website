<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9F295" />
      <stop offset="25%" stop-color="#E0AA3E" />
      <stop offset="55%" stop-color="#FAF196" />
      <stop offset="80%" stop-color="#B8860B" />
      <stop offset="100%" stop-color="#9A6B00" />
    </linearGradient>
    <linearGradient id="innerGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8860B" />
      <stop offset="50%" stop-color="#E6C875" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Luxury Hex/Shield Crest -->
  <polygon points="120,12 216,66 216,174 120,228 24,174 24,66" fill="#0C0C0C" stroke="url(#goldGrad)" stroke-width="4.5" />
  <polygon points="120,24 204,72 204,168 120,216 36,168 36,72" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Architectural Crown Motif at Top -->
  <path d="M85,55 L102,38 L120,52 L138,38 L155,55 L145,68 L95,68 Z" fill="url(#goldGrad)" />
  <circle cx="102" cy="35" r="3.5" fill="url(#goldGrad)" />
  <circle cx="120" cy="47" r="4" fill="#FFF" />
  <circle cx="138" cy="35" r="3.5" fill="url(#goldGrad)" />

  <!-- Monogram PS -->
  <g filter="url(#glow)">
    <!-- P -->
    <path d="M72,85 L112,85 C128,85 138,94 138,107 C138,120 128,129 112,129 L92,129 L92,165 L72,165 Z M92,101 L92,114 L110,114 C116,114 120,110 120,107 C120,104 116,101 110,101 Z" fill="url(#goldGrad)" />
    
    <!-- S -->
    <path d="M125,118 C131,113 140,110 151,110 C165,110 173,117 173,127 C173,139 162,143 146,147 C133,150 123,155 123,168 C123,183 136,192 154,192 C166,192 176,188 183,182 L176,168 C170,173 162,176 154,176 C143,176 137,171 137,164 C137,154 147,151 161,147 C174,144 187,138 187,125 C187,108 172,96 151,96 C138,96 128,100 121,106 Z" fill="url(#innerGold)" />
  </g>

  <!-- Luxury Banner Text Below -->
  <line x1="60" y1="198" x2="180" y2="198" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.6" />
  <text x="120" y="213" text-anchor="middle" fill="url(#goldGrad)" font-family="serif" font-size="11" font-weight="bold" letter-spacing="4">ELITE HOMESTAY</text>
</svg>
